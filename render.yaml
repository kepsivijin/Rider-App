services:
  - type: web
    name: rider-app-api
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/kepsivijin/Rider-App
    branch: main
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python scripts/seed_test_users.py
    startCommand: uvicorn app.main:asgi_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "True"
      - key: JWT_ALGORITHM
        value: HS256
      - key: GOOGLE_MAPS_API_KEY
        value: ""
      - key: RAZORPAY_KEY_ID
        value: dummy
      - key: RAZORPAY_KEY_SECRET
        value: dummy
      - key: FCM_SERVER_KEY
        value: dummy
      - key: SMS_API_KEY
        value: dummy
      - key: SMS_SENDER_ID
        value: RIDESH
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SERVICE_AREA_BOUNDARY
        value: "[[76.948,8.238],[77.265,8.238],[77.265,8.425],[76.948,8.425],[76.948,8.238]]"
